---
layout: null
---
{%- assign home = '/' | append: site.default_lang | append: '/' | relative_url -%}
<!doctype html>
<html lang="{{ site.default_lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.data.i18n[site.default_lang].site_title }}</title>
  <meta http-equiv="refresh" content="0; url={{ home }}">
  <link rel="canonical" href="{{ home }}">
</head>
<body>
  <p>
    {%- for lang in site.languages %}
    <a href="{{ '/' | append: lang | append: '/' | relative_url }}" lang="{{ lang }}">{{ site.data.i18n[lang].lang_name }}</a>{% unless forloop.last %} · {% endunless %}
    {%- endfor %}
  </p>
</body>
</html>
